<div class="cart-page">

  <h2 class="title">🛒 Your Cart</h2>

  <div *ngIf="cart.length === 0" class="empty">
    <p>Your cart is empty.</p>
    <a routerLink="/dashboard" class="empty-btn">Go to Menu</a>
  </div>

  <div *ngIf="cart.length > 0" class="cart-wrapper">

    <div class="cart-item" *ngFor="let item of cart">
      <img [src]="item.image" alt="{{ item.name }}" class="food-img">

      <div class="details">
        <h3>{{ item.name }}</h3>
        <p class="price">₹ {{ item.price }}</p>

        <div class="qty-control">
          <button (click)="increase(item)">+</button>
          <span>{{ item.quantity }}</span>
          <button (click)="decrease(item)">-</button>
        </div>

        <button class="remove-btn" (click)="remove(item._id)">Remove</button>
      </div>
    </div>

    <div class="summary">
      <h3>Total Amount: ₹ {{ total }}</h3>
      <button class="checkout-btn" (click)="checkout()">Proceed to Checkout</button>
    </div>

  </div>

</div>
