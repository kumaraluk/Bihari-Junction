<header class="header">
  <div class="header-container">

    <!-- Logo -->
    <div class="logo">Bihari Junction</div>

    <!-- Navigation -->
    <nav>
      <ul>
        <li><a routerLink="/dashboard">Home</a></li>
        <li><a routerLink="/about">About</a></li>
        <li><a routerLink="/products">Products</a></li>
      </ul>
    </nav>

    <!-- Right Section -->
    <div class="right-section">

      <!-- Search -->
      <div class="search-container">
        <input class="search-input" type="text" placeholder="Search foods..." />
        <fa-icon [icon]="faSearch" class="search-icon"></fa-icon>
      </div>
      <div>
        <a routerLink="/cart" class="cart-icon">🛒</a>

      </div>

      <!-- Avatar dropdown -->
      <div class="profile-container">
        <button class="avatar-btn" (click)="toggleDropdown()">
          <img src="assets/profile.jpg" alt="Profile" class="avatar-img" />
        </button>

        <div *ngIf="isDropdownOpen" class="dropdown">
          <p class="dropdown-name">{{ user?.name || "User" }}</p>
          <a class="dropdown-action" (click)="logout()">Logout</a>
        </div>
      </div>
    </div>

  </div>
</header>

<!-- Dashboard Content -->
<div class="dashboard-container">

  <h2 class="section-title">Popular Bihar Dishes 🍲</h2>

  <div *ngIf="loading" class="loading">Loading menu...</div>
  <div *ngIf="foods.length === 0 && !loading" class="no-data">
    No food items available.
  </div>

  <div class="food-grid">
    <div class="food-card" *ngFor="let food of foods">
      <img [src]="food.image" alt="{{ food.name }}" />
      <h3>{{ food.name }}</h3>
      <p class="desc">{{ food.description }}</p>
      <strong class="price">₹ {{ food.price }}</strong>

      <span class="badge veg" *ngIf="food.veg">Veg</span>
      <span class="badge nonveg" *ngIf="!food.veg">Non-Veg</span>
      <button class="add-btn" (click)="addToCart(food)">Add to Cart</button>
    </div>
  </div>

</div>
