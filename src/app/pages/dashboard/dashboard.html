<!-- Dashboard Content -->
<div class="dashboard-container">
  <h2 class="section-title">Popular Bihar Dishes 🍲</h2>

  <div *ngIf="loading" class="loading">Loading menu...</div>
  <div *ngIf="foods.length === 0 && !loading" class="no-data">No food items available.</div>

  <div class="food-grid">
    <div *ngIf="filteredFoods.length === 0 && !loading" class="no-results">
      This is not a Dish from Bihar.
    </div>
    <div class="food-card" *ngFor="let food of filteredFoods">
      <img [src]="food.image" alt="{{ food.name }}" />
      <h3>{{ food.name }}</h3>
      <p class="desc">{{ food.description }}</p>
      <strong class="price">₹ {{ food.price }}</strong>

      <span class="badge veg" *ngIf="food.veg">Veg</span>
      <span class="badge nonveg" *ngIf="!food.veg">Non-Veg</span>
      <button class="add-btn" (click)="addToCart(food)">Add to Cart</button>
    </div>
  </div>
  <div id="toast" class="toast">Item added to cart ✅</div>
</div>
